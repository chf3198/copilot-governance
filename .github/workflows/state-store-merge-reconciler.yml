name: state-store-merge-reconciler

# Epic 2261 Phase-1 P1-1 (#2275): deterministic, evidence-gated post-merge state-store reconciler —
# the T2 fix that clears admin_ops/code_touched only on a VERIFIABLE merge, so the agent never
# hand-patches the flag (soft-bypass removal). Runs the reconciler's regression spec (hard gate,
# harness:self-test #1893) plus the hermetic self-check (advisory-first; exits 0).

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  state-store-merge-reconciler:
    name: state-store-merge-reconciler (self-test + self-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Hard gate: the reconciler's own regression spec must stay green (evidence-gate, atomic rollback,
      # idempotency — AC1-AC5).
      - name: Self-test (regression)
        run: node scripts/state-store-merge-reconciler.spec.js

      # Advisory: hermetic in-memory verify-then-write / refuse-without-evidence demonstration. Exits 0.
      - name: Self-check (advisory)
        run: node scripts/state-store-merge-reconciler.js --self-check
